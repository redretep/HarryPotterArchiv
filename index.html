<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarryPotterArchiv</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-dark-grey: #181818;
            --spotify-light-grey: #282828;
            --spotify-text: #b3b3b3;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .sidebar {
            background-color: black;
            width: 280px;
        }

        .main-content {
            background: linear-gradient(to bottom, #222222 0%, var(--spotify-black) 40%);
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .player-bar {
            background-color: var(--spotify-dark-grey);
            border-top: 1px solid #282828;
            height: 90px;
        }

        .book-card {
            background-color: var(--spotify-dark-grey);
            transition: background-color 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .book-card:hover {
            background-color: var(--spotify-light-grey);
            transform: translateY(-8px);
        }

        .track-row {
            display: grid;
            grid-template-columns: 40px 1fr 100px;
            align-items: center;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .track-row:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .track-row.active {
            color: var(--spotify-green);
        }

        .progress-bar-container {
            height: 4px;
            background-color: #4f4f4f;
            border-radius: 2px;
            width: 100%;
            cursor: pointer;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: white;
            border-radius: 2px;
            transition: background-color 0.1s;
        }

        /* Smooth Transitions */
        .view-transition {
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1), transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: opacity, transform;
        }

        .fade-out {
            opacity: 0 !important;
            transform: translateY(20px) scale(0.98);
            pointer-events: none;
        }

        .fade-in {
            opacity: 1 !important;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 12px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid transparent;
            background-clip: padding-box;
            border-radius: 6px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            place-items: center;
        }

        .btn-play-hero {
            background-color: var(--spotify-green);
            color: black;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.1s;
        }

        .btn-play-hero:hover {
            transform: scale(1.1);
            background-color: #1ed760;
        }

        #dlProgressBox {
            position: fixed;
            bottom: 110px;
            right: 20px;
            background: var(--spotify-dark-grey);
            border: 1px solid var(--spotify-light-grey);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 340px;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="loader" class="loading-overlay">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin mb-4 mx-auto"></div>
            <p id="loaderText" class="font-medium text-lg">Hogwarts-Archiv wird geladen...</p>
        </div>
    </div>

    <!-- Download Progress Toast -->
    <div id="dlProgressBox">
        <div class="flex justify-between items-start mb-3">
            <div>
                <p class="text-[10px] font-bold uppercase opacity-50 tracking-wider">Download Manager</p>
                <p id="dlBookTitle" class="text-xs font-bold truncate max-w-[200px]">Buchname</p>
            </div>
            <button id="cancelDownloadBtn" class="bg-red-500 hover:bg-red-600 text-white text-[10px] px-2 py-1 rounded font-bold transition-colors">
                ABBRECHEN
            </button>
        </div>
        <p id="dlStatus" class="text-xs truncate mb-2">Bereite vor...</p>
        <div class="progress-bar-container h-1.5 mb-2">
            <div id="dlBarFill" class="progress-bar-fill" style="width: 0%; background-color: var(--spotify-green); transition: width 0.3s ease;"></div>
        </div>
        <div class="flex justify-between items-center">
            <p id="dlRetryStatus" class="text-[9px] text-yellow-500 font-medium"></p>
            <p id="dlPercentage" class="text-[10px] opacity-60 font-mono">0%</p>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar p-6 hidden md:flex flex-col gap-6">
            <div class="flex-1 mt-4 overflow-y-auto custom-scrollbar">
                <p class="text-xs font-bold text-[#b3b3b3] uppercase tracking-widest mb-4">Bibliothek</p>
                <div id="sidebarList" class="space-y-3"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content custom-scrollbar p-6">
            <!-- Grid View -->
            <div id="gridView" class="view-transition fade-in">
                <h1 class="text-3xl font-bold mb-6">Alle Hörbücher</h1>
                <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
            </div>

            <!-- Detail View -->
            <div id="detailView" class="view-transition hidden fade-out">
                <button id="backBtn" class="mb-6 flex items-center gap-2 text-sm font-bold opacity-70 hover:opacity-100 transition-opacity">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Zurück zur Übersicht
                </button>
                
                <div class="flex flex-col md:flex-row gap-8 items-end mb-12">
                    <img id="detailCover" src="" class="w-48 h-48 md:w-64 md:h-64 shadow-2xl rounded-lg object-cover" alt="Cover">
                    <div class="flex-1">
                        <p class="text-xs font-bold uppercase tracking-widest mb-2">Hörbuch</p>
                        <h2 id="detailTitle" class="text-4xl md:text-6xl font-black mb-4 tracking-tight">Titel</h2>
                        <div class="flex items-center gap-2 text-sm font-medium">
                            <span class="text-white">Rufus Beck</span>
                            <span class="opacity-30">•</span>
                            <span id="detailTrackCount" class="opacity-60 text-xs">0 Kapitel</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-6 mb-10">
                    <button id="detailPlayBtn" class="btn-play-hero shadow-xl">
                        <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
                    </button>
                    <button id="downloadAll" class="w-12 h-12 flex items-center justify-center rounded-full border border-white border-opacity-20 opacity-60 hover:opacity-100 hover:border-opacity-100 transition-all" title="Alles laden">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                </div>

                <div class="border-b border-white border-opacity-10 mb-4 pb-2 grid grid-cols-[40px_1fr_100px] px-4 text-[10px] font-bold text-[#b3b3b3] uppercase tracking-widest">
                    <span>#</span>
                    <span>Titel</span>
                    <span class="text-right">Optionen</span>
                </div>
                <div id="trackList" class="space-y-1 mb-20"></div>
            </div>
        </main>
    </div>

    <!-- Player Bar -->
    <footer class="player-bar px-4 flex items-center justify-between z-20">
        <div class="flex items-center gap-4 w-[30%] min-w-[200px]">
            <img id="playerCover" src="" class="w-14 h-14 rounded shadow-md object-cover hidden sm:block" alt="">
            <div class="overflow-hidden">
                <div id="playerTrackName" class="text-sm font-semibold truncate">Bereit zum Hören</div>
                <div id="playerBookName" class="text-[11px] text-[#b3b3b3] truncate lowercase">...</div>
            </div>
        </div>

        <div class="flex flex-col items-center max-w-[40%] w-full gap-2">
            <div class="flex items-center gap-6">
                <button id="prevBtn" class="text-[#b3b3b3] hover:text-white transition-transform active:scale-90"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6,18L14.5,12L6,6V18M16,6V18H18V6H16Z" /></svg></button>
                <button id="playBtn" class="bg-white text-black rounded-full w-8 h-8 flex items-center justify-center hover:scale-110 active:scale-95 transition-transform">
                    <svg id="playIcon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
                    <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z" /></svg>
                </button>
                <button id="nextBtn" class="text-[#b3b3b3] hover:text-white transition-transform active:scale-90"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg></button>
            </div>
            <div class="flex items-center gap-2 w-full text-[10px] text-[#b3b3b3] font-mono">
                <span id="currentTime">0:00</span>
                <div class="progress-bar-container" id="progressBar"><div class="progress-bar-fill" id="progressFill" style="width: 0%"></div></div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 w-[30%] min-w-[120px]">
             <button id="downloadEpisode" class="text-[#b3b3b3] hover:text-white p-2 hover:bg-white hover:bg-opacity-10 rounded-full transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>
        </div>
    </footer>

    <audio id="audioElement"></audio>

    <script>
        const baseUrl = "https://redretep.github.io/HarryPotterArchiv/";
        const imgUrl = "https://redretep.github.io/HarryPotterArchiv/images/";
        const proxyBase = "https://api.pidi.workers.dev/?url=";
        const csvFiles = [
            { id: 1, file: "1 - Harry Potter und der Stein der Weisen.csv" },
            { id: 2, file: "2 - Harry Potter und die Kammer des Schreckens.csv" },
            { id: 3, file: "3 - Harry Potter und der Gefangene von Askaban.csv" },
            { id: 4, file: "4 - Harry Potter und der Feuerkelch.csv" },
            { id: 5, file: "5 - Harry Potter und der Orden des Phönix.csv" },
            { id: 6, file: "6 - Harry Potter und der Halbblutprinz.csv" },
            { id: 7, file: "7 - Harry Potter und die Heiligtümer des Todes.csv" }
        ];

        let collections = {}; 
        let activeBook = null;
        let currentTrackIndex = -1;
        let _playingBookId = -1;
        let isDownloading = false;
        const audio = document.getElementById('audioElement');

        async function init() {
            document.getElementById('loader').style.display = 'grid';
            for (let entry of csvFiles) {
                try {
                    const response = await fetch(baseUrl + encodeURIComponent(entry.file));
                    const text = await response.text();
                    const shortTitle = entry.file.split('-')[1]?.split('.')[0]?.trim();
                    collections[entry.id] = {
                        id: entry.id,
                        shortTitle: shortTitle,
                        image: `${imgUrl}${entry.id}.jpg`,
                        tracks: parseCSV(text)
                    };
                } catch (err) { console.error(err); }
            }
            renderUI();
            document.getElementById('loader').style.display = 'none';
            handleRouting();
        }

        window.addEventListener('hashchange', handleRouting);

        function handleRouting() {
            const hash = window.location.hash;
            if (hash.startsWith('#book-')) {
                const bookId = parseInt(hash.replace('#book-', ''));
                if (collections[bookId]) showDetail(bookId);
            } else {
                hideDetail();
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                const clean = matches.map(p => p.replace(/^"|"$/g, '').trim());
                if (clean.length >= 3) result.push({ podcast: clean[0], name: clean[1], url: clean[2] });
            }
            return result;
        }

        function renderUI() {
            const bookGrid = document.getElementById('bookGrid');
            const sidebarList = document.getElementById('sidebarList');
            bookGrid.innerHTML = ''; sidebarList.innerHTML = '';
            
            Object.values(collections).forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card p-4 rounded-lg shadow-lg';
                card.innerHTML = `<img src="${book.image}" class="w-full aspect-square object-cover rounded-md mb-4 shadow-md"><h3 class="font-bold text-sm truncate mb-1">${book.shortTitle}</h3><p class="text-xs text-[#b3b3b3]">Rufus Beck</p>`;
                card.onclick = () => window.location.hash = `book-${book.id}`;
                bookGrid.appendChild(card);

                const sideItem = document.createElement('div');
                sideItem.className = 'text-sm text-[#b3b3b3] hover:text-white cursor-pointer truncate transition-colors';
                sideItem.innerText = book.shortTitle;
                sideItem.onclick = () => window.location.hash = `book-${book.id}`;
                sidebarList.appendChild(sideItem);
            });
        }

        function showDetail(id) {
            activeBook = collections[id];
            const gv = document.getElementById('gridView');
            const dv = document.getElementById('detailView');

            if (!gv.classList.contains('hidden')) {
                gv.classList.replace('fade-in', 'fade-out');
                setTimeout(() => {
                    gv.classList.add('hidden');
                    dv.classList.remove('hidden');
                    dv.classList.remove('fade-in', 'fade-out');
                    void dv.offsetWidth; // Reflow
                    dv.classList.add('fade-in');
                }, 400); // Etwas längere Pause für smoothes Gefühl
            } else {
                dv.classList.remove('hidden', 'fade-out');
                dv.classList.add('fade-in');
            }
            
            document.getElementById('detailCover').src = activeBook.image;
            document.getElementById('detailTitle').innerText = activeBook.shortTitle;
            document.getElementById('detailTrackCount').innerText = `${activeBook.tracks.length} Kapitel`;
            renderTracks();
        }

        function hideDetail() {
            const gv = document.getElementById('gridView');
            const dv = document.getElementById('detailView');
            if (dv.classList.contains('hidden')) return;

            dv.classList.replace('fade-in', 'fade-out');
            setTimeout(() => {
                dv.classList.add('hidden');
                gv.classList.remove('hidden');
                gv.classList.remove('fade-in', 'fade-out');
                void gv.offsetWidth;
                gv.classList.add('fade-in');
            }, 400);
        }

        function renderTracks() {
            const list = document.getElementById('trackList');
            list.innerHTML = '';
            activeBook.tracks.forEach((track, index) => {
                const isActive = activeBook.id === _playingBookId && index === currentTrackIndex;
                const div = document.createElement('div');
                div.className = `track-row group ${isActive ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="text-sm opacity-50 font-mono">${index + 1}</span>
                    <div class="overflow-hidden">
                        <div class="text-sm font-semibold truncate">${track.name}</div>
                        <div class="text-[10px] opacity-50 truncate tracking-tight lowercase font-medium">${track.podcast}</div>
                    </div>
                    <div class="text-right">
                        <button onclick="event.stopPropagation(); downloadSingle(${index})" class="opacity-0 group-hover:opacity-100 hover:scale-125 transition-all p-2 text-[#b3b3b3] hover:text-white">
                             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </button>
                    </div>`;
                div.onclick = () => playTrack(activeBook.id, index);
                list.appendChild(div);
            });
        }

        function playTrack(bookId, index) {
            const book = collections[bookId];
            if (!book || index < 0 || index >= book.tracks.length) return;
            _playingBookId = bookId; currentTrackIndex = index;
            const track = book.tracks[index];
            audio.src = track.url; audio.play();
            document.getElementById('playerTrackName').innerText = track.name;
            document.getElementById('playerBookName').innerText = book.shortTitle;
            document.getElementById('playerCover').src = book.image;
            document.getElementById('playerCover').classList.remove('hidden');
            updatePlayStateUI(); renderTracks();
        }

        function updatePlayStateUI() {
            const isPlaying = !audio.paused;
            document.getElementById('playIcon').classList.toggle('hidden', isPlaying);
            document.getElementById('pauseIcon').classList.toggle('hidden', !isPlaying);
            const detailBtn = document.getElementById('detailPlayBtn');
            if (detailBtn) detailBtn.innerHTML = isPlaying ? `<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>` : `<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>`;
        }

        audio.ontimeupdate = () => {
            if (!audio.duration) return;
            document.getElementById('progressFill').style.width = `${(audio.currentTime / audio.duration) * 100}%`;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        };
        audio.onended = () => { if (currentTrackIndex + 1 < collections[_playingBookId].tracks.length) playTrack(_playingBookId, currentTrackIndex + 1); };
        document.getElementById('playBtn').onclick = () => { if (audio.src) { audio.paused ? audio.play() : audio.pause(); updatePlayStateUI(); } else if (activeBook) playTrack(activeBook.id, 0); };
        document.getElementById('detailPlayBtn').onclick = () => document.getElementById('playBtn').click();
        document.getElementById('prevBtn').onclick = () => playTrack(_playingBookId, currentTrackIndex - 1);
        document.getElementById('nextBtn').onclick = () => playTrack(_playingBookId, currentTrackIndex + 1);
        document.getElementById('backBtn').onclick = () => window.location.hash = '';
        document.getElementById('progressBar').onclick = (e) => { const rect = document.getElementById('progressBar').getBoundingClientRect(); audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration; };

        function formatTime(s) { const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }

        window.downloadSingle = (idx) => { const t = activeBook.tracks[idx]; saveFile(t.url, `${t.name}.mp3`); };
        document.getElementById('downloadEpisode').onclick = () => { if (currentTrackIndex !== -1) saveFile(collections[_playingBookId].tracks[currentTrackIndex].url, `${collections[_playingBookId].tracks[currentTrackIndex].name}.mp3`); };

        document.getElementById('cancelDownloadBtn').onclick = () => {
            isDownloading = false;
            document.getElementById('dlStatus').innerText = "Abgebrochen...";
            setTimeout(() => document.getElementById('dlProgressBox').style.display = 'none', 1500);
        };

        document.getElementById('downloadAll').onclick = async () => {
            if (!activeBook || isDownloading) return;
            isDownloading = true;

            const db = document.getElementById('dlProgressBox');
            const ds = document.getElementById('dlStatus');
            const dr = document.getElementById('dlRetryStatus');
            const df = document.getElementById('dlBarFill');
            const dp = document.getElementById('dlPercentage');
            const dt = document.getElementById('dlBookTitle');
            
            dt.innerText = activeBook.shortTitle;
            db.style.display = 'block';
            
            try {
                const zip = new JSZip();
                const folder = zip.folder(activeBook.shortTitle);
                const total = activeBook.tracks.length;
                let failedTracks = [];

                for (let i = 0; i < total; i++) {
                    if (!isDownloading) return; // Abbruch Check

                    const t = activeBook.tracks[i];
                    ds.innerText = `Kapitel ${i+1}/${total}: ${t.name}`;
                    dr.innerText = "";
                    
                    let success = false;
                    // Versuch 1-3: Normal
                    // Versuch 4: Proxy
                    for (let attempt = 1; attempt <= 4; attempt++) {
                        if (!isDownloading) return;

                        let fetchUrl = t.url;
                        if (attempt === 4) {
                            dr.innerText = "Fallback: Nutze Proxy...";
                            fetchUrl = proxyBase + encodeURIComponent(t.url);
                        } else if (attempt > 1) {
                            dr.innerText = `CORS Retry ${attempt-1}/3 in 3s...`;
                            await new Promise(res => setTimeout(res, 3000));
                        }

                        try {
                            const r = await fetch(fetchUrl);
                            if (!r.ok) throw new Error("Fetch failed");
                            const blob = await r.blob();
                            folder.file(`${String(i+1).padStart(2, '0')} - ${t.name.replace(/[^\w\s-]/gi, '')}.mp3`, blob);
                            success = true;
                            break; 
                        } catch (e) {
                            if (attempt === 4) failedTracks.push(t.name);
                        }
                    }

                    const progress = ((i + 1) / total) * 100;
                    df.style.width = `${progress}%`;
                    dp.innerText = `${Math.round(progress)}%`;
                    await new Promise(res => setTimeout(res, 100)); // Kleine Pause
                }

                if (!isDownloading) return;

                if (failedTracks.length > 0) {
                    ds.innerText = `Fertig (${failedTracks.length} Fehler)`;
                } else {
                    ds.innerText = "ZIP wird finalisiert...";
                }

                const blob = await zip.generateAsync({type:"blob"});
                saveFile(URL.createObjectURL(blob), `${activeBook.shortTitle}.zip`);
                isDownloading = false;
                setTimeout(() => db.style.display = 'none', 5000);
            } catch(e) { 
                ds.innerText = "Kritischer Fehler!"; 
                isDownloading = false;
            }
        };

        function saveFile(url, name) { 
            const a = document.createElement('a'); a.href = url; a.download = name; a.target = "_blank"; 
            document.body.appendChild(a); a.click(); document.body.removeChild(a); 
        }

        init();
    </script>
</body>
</html>
